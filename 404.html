<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Darren Lin</title>
<meta name="robots" content="noindex">

<meta name="color-scheme" content="dark">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115;
    --surface: #1A1D24;
    --text: #E8E9EC;
    --muted: #8B90A0;
    --accent: #7C9CFF;
    --border: rgba(232, 233, 236, 0.10);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px calc(20px + env(safe-area-inset-right)) 24px calc(20px + env(safe-area-inset-left));
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(232, 233, 236, 0.09) 1px, transparent 1px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 35%, #000 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 80% 60% at 50% 35%, #000 0%, transparent 75%);
  }
  .nf { position: relative; width: 100%; max-width: 520px; }
  .code {
    margin: 0 0 8px;
    font-size: clamp(4.5rem, 24vw, 8.5rem);
    line-height: 1;
    font-weight: 500;
    letter-spacing: -0.05em;
    background: linear-gradient(100deg, #E8E9EC 0%, #E8E9EC 35%, #7C9CFF 50%, #E8E9EC 65%, #E8E9EC 100%);
    background-size: 250% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  h1 { margin: 0 0 12px; font-size: clamp(1.15rem, 5vw, 1.5rem); font-weight: 400; color: var(--text); }
  .path {
    margin: 0 0 32px;
    font-size: 0.85rem;
    color: var(--muted);
    word-break: break-all;
  }
  .path:empty { display: none; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 14px 22px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.3s var(--ease), transform 0.3s var(--ease);
  }
  .btn:hover { border-color: rgba(124, 156, 255, 0.55); transform: translateY(-2px); }
  .btn:active { transform: scale(0.98); }
  .btn .arrow { display: inline-block; transition: transform 0.3s var(--ease); }
  .btn:hover .arrow { transform: translateX(4px); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .reveal { animation: rise 0.9s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 120ms + 100ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .code.reveal { animation: rise 0.9s var(--ease) 100ms backwards, sheen 6s ease-in-out 1.4s infinite; }
  @keyframes sheen { 0% { background-position: 100% 0; } 45% { background-position: 0% 0; } 100% { background-position: 0% 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
    }
    .code { background-position: 0% 0; }
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="nf">
    <p class="code reveal" style="--i:0">404</p>
    <h1 class="reveal" style="--i:1">This page doesn't exist</h1>
    <p class="path reveal" style="--i:2" id="path"></p>
    <a class="btn reveal" style="--i:3" href="/">Back to home <span class="arrow" aria-hidden="true">&rarr;</span></a>
  </main>
  <script>
    var path = location.pathname;
    if (path && path !== "/" && path !== "/404.html") {
      document.getElementById("path").textContent = "Couldn't find " + path;
    }
  </script>
</body>
</html>
